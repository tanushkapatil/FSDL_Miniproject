<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Layout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <p class="eyebrow">Editorial Journal</p>
      <h1>My Blog</h1>
      <p class="lead">Stories, ideas, and practical notes from tech, travel, and food.</p>
    </div>
  </header>

  <main class="page">
    <div class="container">
      <aside class="sidebar card">
        <h2>Categories</h2>
        <ul>
          <li><span class="dot"></span>Tech</li>
          <li><span class="dot"></span>Travel</li>
          <li><span class="dot"></span>Food</li>
        </ul>
      </aside>

      <section class="content card">
        <p class="meta">Featured Post</p>
        <h2>Blog Title</h2>
        <p>This is a sample blog post content. You can write anything here.</p>
        <a class="read-more" href="#" aria-label="Read the full article">Read More</a>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <p>© 2026 My Blog</p>
  </footer>
</body>
</html>
