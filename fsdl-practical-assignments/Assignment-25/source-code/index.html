<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chart App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <p class="eyebrow">Department Analysis</p>
    <h1>Students by Department</h1>
    <p class="subtitle">Interactive bar chart powered by Chart.js and Vite with a responsive card layout.</p>
    <section class="chart-panel">
      <canvas id="myChart" aria-label="Students by department chart"></canvas>
    </section>
  </main>

  <script type="module" src="/main.js"></script>
</body>
</html>
