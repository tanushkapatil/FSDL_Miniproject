<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="hero card">
      <p class="eyebrow">Visual Collection</p>
      <h1>Image Gallery</h1>
      <p class="lead">Explore curated snapshots across nature and tech themes.</p>
    </section>

    <section class="controls card">
      <div class="buttons" aria-label="Gallery filters">
        <button onclick="filter('all')">All</button>
        <button onclick="filter('nature')">Nature</button>
        <button onclick="filter('tech')">Tech</button>
      </div>
    </section>

    <section class="gallery" aria-label="Image gallery">
      <figure class="item nature">
        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=80" alt="Mountain landscape at sunrise">
        <figcaption>Nature</figcaption>
      </figure>

      <figure class="item tech">
        <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=900&q=80" alt="Laptop with code editor on screen">
        <figcaption>Tech</figcaption>
      </figure>

      <figure class="item nature">
        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Forest road with sunlight through trees">
        <figcaption>Nature</figcaption>
      </figure>

      <figure class="item tech">
        <img src="https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=900&q=80" alt="Team working on computers in office">
        <figcaption>Tech</figcaption>
      </figure>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
