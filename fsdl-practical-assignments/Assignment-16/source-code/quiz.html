<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="quiz card">
      <p class="eyebrow">Skill Check</p>
      <h1>Quiz App</h1>
      <h2 id="question">Question here</h2>

      <div id="answers" class="answers" aria-label="Quiz answers"></div>

      <div class="actions">
        <button class="btn primary" onclick="nextQuestion()">Next</button>
        <button class="btn secondary" onclick="submitQuiz()">Submit</button>
      </div>

      <h3 id="result"></h3>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
