<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="form-container">
      <p class="eyebrow">Admissions Portal</p>
      <h1>Student Registration</h1>
      <p class="intro">Complete the details below to reserve your seat for the next academic intake.</p>

      <form>
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Enter your name">

        <label for="email">Email</label>
        <input id="email" type="email" placeholder="Enter your email">

        <label>Gender</label>
        <div class="gender" role="radiogroup" aria-label="Gender">
          <label class="gender-option"><input type="radio" name="gender"> <span>Male</span></label>
          <label class="gender-option"><input type="radio" name="gender"> <span>Female</span></label>
        </div>

        <label for="course">Course</label>
        <select id="course">
          <option>Select Course</option>
          <option>Computer Engineering</option>
          <option>IT</option>
          <option>Mechanical</option>
        </select>

        <label for="address">Address</label>
        <textarea id="address" placeholder="Enter your address"></textarea>

        <button type="submit">Register</button>
      </form>
    </section>
  </main>
</body>
</html>
