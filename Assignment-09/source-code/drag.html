<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Drag and Drop List</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="app">
		<section class="panel">
			<p class="eyebrow">Task Organizer</p>
			<h1>Drag and Drop List</h1>
			<p class="subtitle">Grab any item and move it to reorder the list dynamically.</p>

			<ul class="list" id="list">
				<li class="item" draggable="true">Design homepage layout</li>
				<li class="item" draggable="true">Write content for hero section</li>
				<li class="item" draggable="true">Add responsive navigation</li>
				<li class="item" draggable="true">Review mobile spacing</li>
				<li class="item" draggable="true">Optimize image assets</li>
				<li class="item" draggable="true">Test final user flow</li>
			</ul>
		</section>
	</main>

	<script src="script.js"></script>
</body>
</html>
