<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="hero">
      <p class="eyebrow">Live Profile Preview</p>
      <h1>Edit your profile and see it update instantly</h1>
      <p class="subtitle">A clean editor and preview layout with a more polished visual style.</p>
    </section>

    <div class="container">
      <div class="form panel">
        <h2>Edit Profile</h2>

        <label for="nameInput">Name</label>
        <input type="text" id="nameInput" placeholder="Enter name">

        <label for="roleInput">Role</label>
        <input type="text" id="roleInput" placeholder="Enter role">

        <label for="bioInput">Bio</label>
        <textarea id="bioInput" placeholder="Enter bio"></textarea>

        <label for="imgInput">Image URL</label>
        <input type="text" id="imgInput" placeholder="Enter image URL">
      </div>

      <div class="card panel">
        <div class="avatar-ring">
          <img id="profileImg" src="https://via.placeholder.com/120" alt="Profile preview">
        </div>
        <h2 id="profileName">Your Name</h2>
        <p id="profileRole" class="role">Your Role</p>
        <p id="profileBio" class="bio">Your bio will appear here...</p>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
