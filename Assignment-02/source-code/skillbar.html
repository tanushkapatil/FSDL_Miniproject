<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Bar Component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="skills-card">
      <p class="eyebrow">My Skills</p>
      <h1>Progress Overview</h1>
      <p class="subtitle">A clean skill bar layout with smooth animated fills and a modern visual style.</p>

      <form class="skill-form" id="skillForm">
        <div class="field-group">
          <label for="skillName">Skill</label>
          <input type="text" id="skillName" name="skillName" placeholder="Enter a skill name" required>
        </div>

        <div class="field-group">
          <label for="skillPercent">Percentage</label>
          <input type="number" id="skillPercent" name="skillPercent" min="0" max="100" placeholder="0 - 100" required>
        </div>

        <button type="submit" class="add-btn">Add Skill</button>
      </form>

      <div class="skills-container" id="skillsContainer"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
